<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Markdown WYSIWYG Editor — Standalone</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- marked & turndown -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://unpkg.com/turndown/dist/turndown.js"></script>
<script src="https://unpkg.com/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0d0d11;
  --surface:     #14141c;
  --surface2:    #1c1c27;
  --surface3:    #242433;
  --border:      rgba(255,255,255,0.08);
  --accent:      #7c6af7;
  --accent2:     #a78bfa;
  --accent-glow: rgba(124,106,247,0.35);
  --text:        #e2e2e8;
  --muted:       #7c7c94;
  --success:     #34d399;
  --warning:     #fbbf24;
  --danger:      #f87171;
  --font-ui:     'Inter', system-ui, sans-serif;
  --font-mono:   'JetBrains Mono', monospace;
}

body.light {
  --bg:          #f8f9fc;
  --surface:     #ffffff;
  --surface2:    #f1f2f7;
  --surface3:    #e5e7eb;
  --border:      rgba(0,0,0,0.08);
  --text:        #121217;
  --muted:       #64748b;
  --accent:      #6352e8;
  --accent2:     #7c6af7;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Header */
#header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  user-select: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 14px;
}
.logo-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  box-shadow: 0 0 10px var(--accent-glow);
}
#doc-title {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 6px;
  outline: none;
  font-family: var(--font-ui);
}
#doc-title:focus {
  background: var(--surface2);
}

.view-tabs {
  display: flex;
  align-items: center;
  background: var(--surface2);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.v-tab {
  padding: 4px 12px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.v-tab.active {
  background: var(--accent);
  color: #fff;
}

.actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  height: 30px;
  padding: 0 12px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn:hover {
  background: var(--surface3);
}
.btn.primary {
  background: var(--accent);
  color: white;
  border-color: transparent;
}
.btn.primary:hover {
  background: var(--accent2);
}

/* Panes */
#main-view {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.pane {
  flex: 1;
  height: 100%;
  overflow-y: auto;
  min-width: 0;
}

#markdown-pane {
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: none;
}
#markdown-textarea {
  width: 100%;
  height: 100%;
  padding: 24px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.7;
  resize: none;
}

/* WYSIWYG Container */
#wysiwyg-pane {
  display: flex;
  justify-content: center;
  padding: 32px 24px 80px;
  cursor: text;
}
.wysiwyg-doc {
  max-width: 780px;
  width: 100%;
  outline: none;
  min-height: 80vh;
  line-height: 1.75;
  font-size: 16px;
}

/* Typography */
.wysiwyg-doc h1 { font-size: 2.1rem; font-weight: 700; margin: 1.5em 0 0.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.wysiwyg-doc h2 { font-size: 1.6rem; font-weight: 600; margin: 1.3em 0 0.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
.wysiwyg-doc h3 { font-size: 1.25rem; font-weight: 600; margin: 1.1em 0 0.3em; }
.wysiwyg-doc p { margin: 0.8em 0; }
.wysiwyg-doc a { color: var(--accent2); text-decoration: underline; text-underline-offset: 3px; }
.wysiwyg-doc blockquote {
  border-left: 4px solid var(--accent);
  padding: 8px 16px;
  margin: 1em 0;
  background: rgba(124,106,247,0.06);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
}
.wysiwyg-doc code:not(pre code) {
  font-family: var(--font-mono);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: #e879f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.88em;
}
.wysiwyg-doc pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  margin: 1em 0;
  font-family: var(--font-mono);
}
.wysiwyg-doc ul, .wysiwyg-doc ol { padding-left: 1.8em; margin: 0.8em 0; }
.wysiwyg-doc li { margin: 0.3em 0; }
.wysiwyg-doc li.task-item {
  list-style: none;
  margin-left: -1.4em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wysiwyg-doc li.task-item input {
  accent-color: var(--accent);
  cursor: pointer;
}
.wysiwyg-doc mark {
  background: rgba(251,191,36,0.25);
  color: inherit;
  padding: 2px 4px;
  border-radius: 3px;
}
.wysiwyg-doc table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.2em 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.wysiwyg-doc th, .wysiwyg-doc td {
  border: 1px solid var(--border);
  padding: 10px 14px;
  text-align: left;
}
.wysiwyg-doc th {
  background: var(--surface2);
  font-weight: 600;
}
.wysiwyg-doc hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

/* Floating Format Toolbar */
#floating-toolbar {
  position: fixed;
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  box-shadow: 0 16px 36px rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  gap: 2px;
  transform: translateX(-50%);
  user-select: none;
}
.ft-btn {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 6px 8px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ft-btn:hover {
  background: var(--surface2);
}
.ft-sep {
  width: 1px;
  height: 14px;
  background: var(--border);
  margin: 0 3px;
}

/* Slash Command Menu */
#slash-menu {
  position: fixed;
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 16px 36px rgba(0,0,0,0.6);
  z-index: 100;
  width: 240px;
  max-height: 280px;
  overflow-y: auto;
  padding: 6px;
}
.slash-item {
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
}
.slash-item:hover, .slash-item.selected {
  background: var(--accent);
  color: white;
}

/* Status bar */
#statusbar {
  height: 30px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <div class="brand">
      <div class="logo-icon">✦</div>
      <input id="doc-title" value="My Document.md" />
    </div>

    <div class="view-tabs">
      <button class="v-tab active" onclick="switchView('wysiwyg')">WYSIWYG</button>
      <button class="v-tab" onclick="switchView('split')">Split</button>
      <button class="v-tab" onclick="switchView('markdown')">Markdown</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="exportHtml()">HTML Output</button>
      <button class="btn primary" onclick="exportMarkdown()">Export .md</button>
      <button class="btn" onclick="toggleTheme()">☀/☾</button>
    </div>
  </div>

  <!-- Panes -->
  <div id="main-view">
    <div class="pane" id="markdown-pane">
      <textarea id="markdown-textarea" placeholder="Type markdown here..."></textarea>
    </div>

    <div class="pane" id="wysiwyg-pane">
      <div class="wysiwyg-doc" id="wysiwyg-doc" contenteditable="true"></div>
    </div>
  </div>

  <!-- Floating Formatting Toolbar -->
  <div id="floating-toolbar" onmousedown="event.preventDefault()">
    <button class="ft-btn" onclick="fmt('bold')"><b>B</b></button>
    <button class="ft-btn" onclick="fmt('italic')"><i>I</i></button>
    <button class="ft-btn" onclick="fmt('underline')"><u>U</u></button>
    <button class="ft-btn" onclick="fmt('strikeThrough')"><s>S</s></button>
    <div class="ft-sep"></div>
    <button class="ft-btn" onclick="fmt('formatBlock', '<h1>')">H1</button>
    <button class="ft-btn" onclick="fmt('formatBlock', '<h2>')">H2</button>
    <button class="ft-btn" onclick="fmt('formatBlock', '<blockquote>')">Quote</button>
    <button class="ft-btn" onclick="fmt('insertUnorderedList')">• List</button>
  </div>

  <!-- Slash Command Menu -->
  <div id="slash-menu">
    <div class="slash-item" onclick="insertBlock('h1')">Heading 1</div>
    <div class="slash-item" onclick="insertBlock('h2')">Heading 2</div>
    <div class="slash-item" onclick="insertBlock('ul')">Bullet List</div>
    <div class="slash-item" onclick="insertBlock('ol')">Numbered List</div>
    <div class="slash-item" onclick="insertBlock('task')">To-do Checklist</div>
    <div class="slash-item" onclick="insertBlock('quote')">Quote</div>
    <div class="slash-item" onclick="insertBlock('table')">Table</div>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <div id="stats-display">Words: 0 | Chars: 0 | Lines: 0</div>
    <div id="save-status">● Saved</div>
  </div>
</div>

<script>
const STARTER = `# Welcome to Markdown WYSIWYG ✦

Click anywhere in this document and start editing directly like **Notion** or **Word**.

## Interactive Features

- Select any text to reveal the **Floating Format Toolbar** (Bold, Italic, Underline, Strike, Headings)
- Type \`/\` on an empty line for block options
- Interactive task list:
- [x] Full inline WYSIWYG editing
- [ ] Markdown source code sync
- [ ] Real-time HTML output

> Pro-tip: Switch views at any time between WYSIWYG, Split, and Markdown!

| Feature | Status |
|---|---|
| Inline WYSIWYG | Enabled |
| HTML Export | Built-in |
`;

const wysiwygDoc = document.getElementById('wysiwyg-doc');
const mdTextarea = document.getElementById('markdown-textarea');
const floatingToolbar = document.getElementById('floating-toolbar');
const slashMenu = document.getElementById('slash-menu');
let currentView = 'wysiwyg';

// Marked setup
marked.setOptions({ gfm: true, breaks: true });

// Turndown setup
const turndown = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-' });
if (window.turndownPluginGfm) {
  turndown.use(window.turndownPluginGfm.gfm);
}

// Initial populate
wysiwygDoc.innerHTML = marked.parse(STARTER);
mdTextarea.value = STARTER;
updateStats();

// Sync WYSIWYG -> Markdown
wysiwygDoc.addEventListener('input', () => {
  const md = turndown.turndown(wysiwygDoc.innerHTML);
  mdTextarea.value = md;
  updateStats();
  checkSlash();
});

// Sync Markdown -> WYSIWYG
mdTextarea.addEventListener('input', () => {
  wysiwygDoc.innerHTML = marked.parse(mdTextarea.value);
  updateStats();
});

// Floating toolbar trigger
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !wysiwygDoc.contains(sel.anchorNode)) {
    floatingToolbar.style.display = 'none';
    return;
  }
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  if (rect.width === 0) {
    floatingToolbar.style.display = 'none';
    return;
  }
  floatingToolbar.style.display = 'flex';
  floatingToolbar.style.top = (rect.top - 46 + window.scrollY) + 'px';
  floatingToolbar.style.left = (rect.left + rect.width / 2) + 'px';
});

function fmt(cmd, val = null) {
  wysiwygDoc.focus();
  document.execCommand(cmd, false, val);
  const md = turndown.turndown(wysiwygDoc.innerHTML);
  mdTextarea.value = md;
  updateStats();
}

// Slash commands
function checkSlash() {
  const sel = window.getSelection();
  if (!sel || !sel.isCollapsed) return;
  const node = sel.anchorNode;
  if (node && node.textContent && node.textContent.endsWith('/')) {
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    slashMenu.style.display = 'block';
    slashMenu.style.top = (rect.bottom + 6) + 'px';
    slashMenu.style.left = rect.left + 'px';
  } else {
    slashMenu.style.display = 'none';
  }
}

function insertBlock(type) {
  slashMenu.style.display = 'none';
  wysiwygDoc.focus();
  // Remove slash
  const sel = window.getSelection();
  if (sel && sel.anchorNode && sel.anchorNode.textContent) {
    sel.anchorNode.textContent = sel.anchorNode.textContent.replace(/\/$/, '');
  }
  if (type === 'h1') document.execCommand('formatBlock', false, '<h1>');
  else if (type === 'h2') document.execCommand('formatBlock', false, '<h2>');
  else if (type === 'ul') document.execCommand('insertUnorderedList');
  else if (type === 'ol') document.execCommand('insertOrderedList');
  else if (type === 'quote') document.execCommand('formatBlock', false, '<blockquote>');
  else if (type === 'task') document.execCommand('insertHTML', false, '<ul><li class="task-item"><input type="checkbox"/> <span>New task</span></li></ul>');
  else if (type === 'table') document.execCommand('insertHTML', false, '<table><tr><th>Col 1</th><th>Col 2</th></tr><tr><td>Data 1</td><td>Data 2</td></tr></table>');
  
  const md = turndown.turndown(wysiwygDoc.innerHTML);
  mdTextarea.value = md;
  updateStats();
}

function switchView(mode) {
  currentView = mode;
  document.querySelectorAll('.v-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  const mdPane = document.getElementById('markdown-pane');
  const wyPane = document.getElementById('wysiwyg-pane');
  if (mode === 'wysiwyg') {
    mdPane.style.display = 'none';
    wyPane.style.display = 'flex';
  } else if (mode === 'markdown') {
    mdPane.style.display = 'block';
    wyPane.style.display = 'none';
  } else {
    mdPane.style.display = 'block';
    wyPane.style.display = 'flex';
  }
}

function updateStats() {
  const text = mdTextarea.value.trim();
  const words = text ? text.split(/\s+/).length : 0;
  const chars = mdTextarea.value.length;
  const lines = text ? text.split('\n').length : 0;
  document.getElementById('stats-display').textContent = `Words: ${words} | Chars: ${chars} | Lines: ${lines}`;
}

function toggleTheme() {
  document.body.classList.toggle('light');
}

function exportHtml() {
  const blob = new Blob([wysiwygDoc.innerHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.html';
  a.click();
}

function exportMarkdown() {
  const blob = new Blob([mdTextarea.value], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.md';
  a.click();
}
</script>
</body>
</html>
